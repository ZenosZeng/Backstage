[workspace]
name = "agent-workspace"
version = "0.12.0"
description = "Memory, monitoring and remote Agent tools"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.12"

[pypi-dependencies]
lark-oapi = "==1.7.2"
markdown-it-py = ">=3, <4"

[tasks]
memory = "python scripts/memory.py"
sync = "python scripts/sync.py"
memory-eval = "python scripts/evaluate_memory.py"
watchdog = "python -m tools.watchdog"
interaction = "python -m tools.watchdog.interaction"
cluster-monitor = "python -m tools.cluster"
claude-feishu = "python -m tools.claude_feishu"
tools-status = "python -m tools.service --all-status"
web = "python -m tools.web"

[feature.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.11,<1"

[feature.dev.tasks]
test = "python -m pytest tests tools/tests -q"
lint = "ruff check scripts tools --select E9,F"

[environments]
default = { features = [], solve-group = "tools" }
dev = { features = ["dev"], solve-group = "tools" }
